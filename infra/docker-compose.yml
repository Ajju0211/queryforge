services:
  # Internal Application Database
  # Used to store users, workspaces, encrypted connection configs, metadata, and audit logs.
  app-postgres:
    image: postgres:16-alpine
    container_name: ai_workspace_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_workspace_internal
    ports:
      - "5432:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_workspace_internal"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Demo Customer Database
  # Used for local development and integration tests to simulate a customer PostgreSQL instance.
  customer-demo-postgres:
    image: postgres:16-alpine
    container_name: ai_workspace_demo_customer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demopassword
      POSTGRES_DB: customer_demo_db
    ports:
      - "5433:5432"
    volumes:
      - ./seed/demo_customer.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - demo_customer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_demo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_db_data:
  demo_customer_data:
